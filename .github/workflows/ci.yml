name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: shellcheck install.sh and uninstall.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: .
          check_together: 'yes'

  skill-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate SKILL.md frontmatter
        run: |
          set -euo pipefail
          exit_code=0
          for f in skills/*/SKILL.md claude-code/skills/*/SKILL.md; do
            [ -f "$f" ] || continue

            first_line="$(head -n1 "$f")"
            if [ "$first_line" != "---" ]; then
              echo "FAIL: $f does not start with '---' frontmatter"
              exit_code=1
              continue
            fi

            frontmatter="$(awk 'NR==1{next} /^---$/{exit} {print}' "$f")"

            if ! printf '%s\n' "$frontmatter" | grep -q '^name:'; then
              echo "FAIL: $f frontmatter missing 'name:'"
              exit_code=1
            fi

            if ! printf '%s\n' "$frontmatter" | grep -q '^description:'; then
              echo "FAIL: $f frontmatter missing 'description:'"
              exit_code=1
            fi
          done
          exit "$exit_code"

      - name: Validate claude-code/settings.json is valid JSON
        run: jq empty claude-code/settings.json
